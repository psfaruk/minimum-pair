# Nixpacks build recipe — maximally fault-tolerant.
#
# The 2026-09-10 deploy failed because the aptPkgs list generated a
# hard-fail `apt-get install` layer in the builder (an apt hiccup there
# kills the whole deploy). This recipe keeps the same capability but
# nothing in it can fail the build:
#
#   - no aptPkgs: no generated apt-get layer at all;
#   - every optional capability is installed inside install cmds with
#     `|| echo WARN` fallbacks (shell continues on failure);
#   - playwright is NOT in requirements.txt — the app lazy-imports it
#     (app/browser_transport.py), so without it the app still boots,
#     /api/status honestly reports the solver as unavailable, the
#     3-tier transport degrades to the python dial + QUOTEX_PROXY,
#     and token → live data still works whenever Cloudflare lets the
#     python TLS through (which the live matrix proved happens).
#
# System libs for Chromium headless (nss/atk/cups/gbm/…) are attempted
# via a best-effort apt-get in the install phase; if the builder's apt
# is broken, the deploy still succeeds — only the browser solver is
# missing, and `QUOTEX_PROXY` remains the guaranteed bypass.

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "(sudo apt-get update -qq || apt-get update -qq || true) && (sudo apt-get install -y --no-install-recommends libnss3 nspr libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 libatspi2.0-0 || apt-get install -y --no-install-recommends libnss3 nspr libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 libatspi2.0-0 || echo 'WARN: chromium system libs not installed — solver will be unavailable')",
  "pip install playwright || echo 'WARN: playwright not installed — solver will be unavailable'",
  "python -m playwright install chromium || echo 'WARN: chromium binary not installed — solver will be unavailable'",
]
